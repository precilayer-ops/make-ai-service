name: Deploy to EC2

on:
  push:
    branches:
      - dev-ndcs
      - prod-ndcs
      - dev-pipl
      - prod-pipl
      - dev-pipl-deploy
      - prod-pipl-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Environment Variables
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          echo "APP_ENV=$BRANCH_NAME" >> $GITHUB_ENV

          if [[ "$BRANCH_NAME" == *"-deploy" ]]; then
            echo "PROJECT_DIR=/opt/erp-application/make-ai-service/$BRANCH_NAME" >> $GITHUB_ENV
          else
            echo "PROJECT_DIR=/home/ubuntu/make-ai-service/$BRANCH_NAME" >> $GITHUB_ENV
          fi

          if [[ "$BRANCH_NAME" == "dev-ndcs" ]]; then
            echo 'INSTANCE_NAME=NDCS_MAKE_AI' >> $GITHUB_ENV
            echo 'PM2_PROCESS_NAME=dev-make-ai-ndcs' >> $GITHUB_ENV
            echo 'START_COMMAND=pm2 start "source .venv/bin/activate && uvicorn server:app --host 0.0.0.0 --port 4008 --workers 2" --name dev-make-ai-ndcs' >> $GITHUB_ENV
            echo 'PORT=4008' >> $GITHUB_ENV
          elif [[ "$BRANCH_NAME" == "prod-ndcs" ]]; then
            echo 'INSTANCE_NAME=NDCS_MAKE_AI' >> $GITHUB_ENV
            echo 'PM2_PROCESS_NAME=prod-make-ai-ndcs' >> $GITHUB_ENV
            echo 'START_COMMAND=pm2 start "source .venv/bin/activate && uvicorn server:app --host 0.0.0.0 --port 4009 --workers 2" --name prod-make-ai-ndcs' >> $GITHUB_ENV
            echo 'PORT=4009' >> $GITHUB_ENV
          elif [[ "$BRANCH_NAME" == "dev-pipl" ]]; then
            echo 'INSTANCE_NAME=PIPL_MAKE_AI' >> $GITHUB_ENV
            echo 'PM2_PROCESS_NAME=dev-make-ai-pipl' >> $GITHUB_ENV
            echo 'START_COMMAND=pm2 start "source .venv/bin/activate && uvicorn server:app --host 0.0.0.0 --port 4006 --workers 2" --name dev-make-ai-pipl' >> $GITHUB_ENV
            echo 'PORT=4006' >> $GITHUB_ENV
          elif [[ "$BRANCH_NAME" == "prod-pipl" ]]; then
            echo 'INSTANCE_NAME=PIPL_MAKE_AI' >> $GITHUB_ENV
            echo 'PM2_PROCESS_NAME=prod-make-ai-pipl' >> $GITHUB_ENV
            echo 'START_COMMAND=pm2 start "source .venv/bin/activate && uvicorn server:app --host 0.0.0.0 --port 4007 --workers 2" --name prod-make-ai-pipl' >> $GITHUB_ENV
            echo 'PORT=4007' >> $GITHUB_ENV
          elif [[ "$BRANCH_NAME" == "dev-pipl-deploy" ]]; then
            echo 'INSTANCE_NAME=PIPL_MAKE_AI' >> $GITHUB_ENV
            echo 'PM2_PROCESS_NAME=dev-make-ai-backend-pipl' >> $GITHUB_ENV
            echo 'START_COMMAND=pm2 start "source .venv/bin/activate && uvicorn server:app --host 0.0.0.0 --port 4006 --workers 2" --name dev-make-ai-backend-pipl' >> $GITHUB_ENV
            echo 'PORT=4006' >> $GITHUB_ENV
          elif [[ "$BRANCH_NAME" == "prod-pipl-deploy" ]]; then
            echo 'INSTANCE_NAME=PIPL_MAKE_AI' >> $GITHUB_ENV
            echo 'PM2_PROCESS_NAME=prod-make-ai-backend-pipl' >> $GITHUB_ENV
            echo 'START_COMMAND=pm2 start "source .venv/bin/activate && uvicorn server:app --host 0.0.0.0 --port 4007 --workers 2" --name prod-make-ai-backend-pipl' >> $GITHUB_ENV
            echo 'PORT=4007' >> $GITHUB_ENV
          else
            echo 'INSTANCE_NAME=UNKNOWN_AI' >> $GITHUB_ENV
            echo 'START_COMMAND=echo No valid start command' >> $GITHUB_ENV
          fi

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ (github.ref_name == 'dev-pipl-deploy' || github.ref_name == 'prod-pipl-deploy') && secrets.PIPL_EC2_HOST || secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ (github.ref_name == 'dev-pipl-deploy' || github.ref_name == 'prod-pipl-deploy') && secrets.PIPL_EC2_SSH_KEY || secrets.EC2_SSH_KEY }}
          script: |
            set -e  # Exit on error

            export APP_ENV=${{ env.APP_ENV }}
            export INSTANCE_NAME=${{ env.INSTANCE_NAME }}
            export PROJECT_DIR="${{ env.PROJECT_DIR }}"
            export START_COMMAND="${{ env.START_COMMAND }}"
            export PM2_PROCESS_NAME=${{ env.PM2_PROCESS_NAME }}
            export PORT=${{ env.PORT }}

            echo "Navigating to project directory: $PROJECT_DIR"
            cd $PROJECT_DIR

            echo "Pulling latest changes for $APP_ENV..."
            git pull origin "$APP_ENV" || true

            # Ensure virtualenv exists
            if [ ! -d ".venv" ]; then
              echo "Creating Python virtual environment..."
              python3 -m venv .venv
            fi

            # Install/update dependencies
            echo "Installing Python dependencies..."
            source .venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt

            echo "Checking PM2 process list..."
            pm2 list

            echo "Checking if PM2 process '$PM2_PROCESS_NAME' is running..."
            if pm2 describe "$PM2_PROCESS_NAME" >/dev/null 2>&1; then
              echo "Process exists, restarting..."
              pm2 restart "$PM2_PROCESS_NAME" --update-env
            else
              echo "Process does not exist or is unsynchronized, starting fresh deployment..."

              # Stop any existing process on port $PORT
              fuser -k $PORT/tcp || true

              # Remove any existing PM2 process with the same name
              pm2 delete "$PM2_PROCESS_NAME" || true  

              echo "Starting application..."
              eval "$START_COMMAND"

              # Ensure PM2 saves the process
              pm2 save
            fi

            echo "Verifying if application is running..."
            sleep 5

            if pm2 show "$PM2_PROCESS_NAME" | grep -q "online"; then
              echo "Deployment successful!"
            else
              echo "App failed to start. Checking rollback conditions..."

              if pm2 describe "$PM2_PROCESS_NAME" >/dev/null 2>&1; then
                echo "Rolling back to previous stable commit..."
                git reset --hard HEAD~1
                git pull origin "$APP_ENV"
                source .venv/bin/activate
                pip install -r requirements.txt
                pm2 restart "$PM2_PROCESS_NAME" --update-env
                pm2 save
              else
                echo "First-time deployment failed. No rollback performed."
              fi
            fi
